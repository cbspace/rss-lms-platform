services:
  frontend:
    container_name: frontend
    build:
      context: ./frontend
      target: runner # Multi-stage build target
      args:
        - API_URL=http://api:3000   # Pass as arg to use in the static node build
    restart: unless-stopped
    ports:
      - "80:3000"
    depends_on:
      - api
    environment:
      - NODE_ENV=production
    # Hot-reloading bind mounts removed for production

  api:
    container_name: api
    build:
      context: ./api
      target: runner
      args:
        DATABASE_URL: ${DATABASE_URL}  # Pass as arg to use in the static node build
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    restart: unless-stopped
    ports:
      - "4080:3000"
    depends_on:
      postgres:
        condition: service_healthy     # Ensures Postgres is fully ready before API starts
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      HOSTNAME: "0.0.0.0"

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Do NOT expose port 5432 to the public internet on EC2!
    # The API container connects internally via the Docker network.
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Cloudflare Tunnel Service
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}

volumes:
  postgres_data:
