services:
  frontend:
    build: ./frontend
    ports:
      - "90:3000"          # I use 90 for local dev
    depends_on:
      - api
    environment:
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
      - /app/node_modules  # Optional: prevents overwriting node_modules in dev
    command: npm run dev

  api:
    build: ./api
    ports:
      - "8080:3000"
    depends_on:
      - postgres
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./api:/app
      - /app/node_modules/.prisma  # Optional: same as frontend

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
